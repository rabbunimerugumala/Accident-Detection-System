<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- FOUT prevention: apply .dark before React loads to avoid flash of wrong theme -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* localStorage blocked (private mode etc.) — stay light */ }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/heartbeat.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeGuardX | Smart Accident Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- UI Engine -->
</head>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
